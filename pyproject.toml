[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cursorrace"
version = "0.1.0"
description = "Offline snapshot pagination trace auditor"
readme = "README.md"
requires-python = ">=3.14.8,<3.15"
license = "MIT"
dependencies = []

[project.scripts]
cursorrace = "cursorrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cursorrace = ["schemas/*.json", "README.md"]
